<div class="job-card-container">
  <div class="job-card-top">
    <h4>{{ cutText(title, 30) }}</h4>
    <p>
      <span>{{ jobType }}</span>
      Salary: {{ salary }} {{ currency }}
    </p>
    <div class="employer-details">
      <div class="logo">
        @if (company?.logoURL) {
          <img *ngIf="company?.logoURL" [src]="company?.logoURL!" [alt]="company?.name" />
        } @else {
          <span class="initials">{{ initials(company?.name) }}</span>
        }
      </div>
      <div class="employer">
        <h5>{{ company?.name }}</h5>
        <p>{{ company?.location?.city }}, {{ company?.location?.country }}</p>
      </div>
    </div>
    <div class="applicants">
      <div class="applicant-profiles">
        <img src="/images/Ellipse6.png" alt="profile" />
        <img src="/images/Ellipse7.png" alt="profile" />
        <img src="/images/Ellipse8.png" alt="profile" />
      </div>
      <p class="applicant-count">{{ applicants?.length }} applicants</p>
    </div>
    <div class="card-btns">
      <a [routerLink]="['/vacancy', id]">
        <button class="details">View Details</button>
      </a>

      <button class="apply" (click)="apply()" [disabled]="isApplied" [class.applied]="isApplied">
        {{ isApplied ? 'Applied' : 'Apply' }}
      </button>
    </div>
  </div>
</div>
